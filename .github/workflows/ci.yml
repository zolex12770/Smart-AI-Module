name: CI

# docs/26_DECISIONS.md ADR-035 (original) and ADR-061 (this revision).
#
# HONEST STATUS: this workflow has still never executed on GitHub Actions — the repository
# that authored it has no remote (`git remote -v` is empty). Every step below was chosen to
# match a command that IS run locally, but "CI green" remains unverified until a first push.
#
# The gates are ordered cheapest-first so a typo fails in seconds rather than after the full
# integration suite. Nothing is `continue-on-error`: a step that cannot fail is not a gate.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Packages must be built before typecheck: each workspace's `tsc --noEmit` resolves
      # cross-package types through the compiled `dist`, not through source.
      - name: Build packages
        run: npm run build:packages

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build apps
        run: npm run build

      # --- external services the integration tests genuinely use ------------------------
      # Both suites skip loudly rather than silently when their binary is absent; installing
      # them here is what makes those tests actually run in CI instead of quietly passing.
      - name: Install fake-gcs-server (Cloud Storage integration tests)
        run: |
          set -euo pipefail
          VERSION=1.56.1
          curl -sSfL -o /tmp/fake-gcs.tar.gz \
            "https://github.com/fsouza/fake-gcs-server/releases/download/v${VERSION}/fake-gcs-server_${VERSION}_Linux_amd64.tar.gz"
          mkdir -p /tmp/fake-gcs && tar -xzf /tmp/fake-gcs.tar.gz -C /tmp/fake-gcs
          echo "FAKE_GCS_SERVER_BIN=/tmp/fake-gcs/fake-gcs-server" >> "$GITHUB_ENV"

      - name: Install ClamAV daemon (malware scanning tests)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav-daemon
          # The tests spawn their own clamd with a one-signature database; the packaged
          # services must not hold the socket or the port.
          sudo systemctl stop clamav-freshclam clamav-daemon || true
          echo "CLAMD_BIN=/usr/sbin/clamd" >> "$GITHUB_ENV"

      # A general-purpose build, not a minimal one: the render pipeline needs a gif demuxer,
      # libx264 and the mp4 muxer, and the integration test probes for exactly those before it
      # will run (ADR-069).
      - name: Install ffmpeg (video render integration tests)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG_TEST_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Test (all workspaces)
        run: npm test

      # A skipped test is not a passing test (product brief §29). This fails the build if the
      # environment-gated suites silently skipped instead of running.
      - name: Assert the gated suites actually ran
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/test-output.txt
          if grep -qiE "SKIPPING the real (clamd|ffmpeg)|skipping (clamd|fake-gcs)" /tmp/test-output.txt; then
            echo "::error::An environment-gated suite skipped in CI. Those binaries are installed above, so a skip means the gate is broken."
            exit 1
          fi

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build packages
        run: npm run build:packages
      - name: Test (web)
        run: npm test --workspace=@ai-platform/web --if-present
      - name: Build (web)
        run: npm run build --workspace=@ai-platform/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8790

  e2e:
    name: End-to-end (real browser, real API, real database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build everything the suite drives
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8790
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Playwright starts both servers itself (see playwright.config.ts) so this exercises the
      # real API against a real database and the real production build of the web app.
      - name: Run E2E
        run: npx playwright test
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci

      # Fails on high/critical only. One moderate advisory is accepted and argued in
      # docs/27_RISKS_AND_LIMITATIONS.md; a blanket `--audit-level=moderate` would fail on it
      # every run and train everyone to ignore the gate.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Assert no production code path returns a fake implementation
        run: |
          set -euo pipefail
          # Product brief §32: mock providers must never be reachable in production. The
          # composition root refuses to construct them when NODE_ENV=production; this checks
          # nobody has since added an unconditional construction.
          if grep -rn "new Mock" apps/api/src --include=*.ts | grep -v "NODE_ENV" | grep -v test; then
            echo "::error::A mock provider is constructed outside a NODE_ENV guard."
            exit 1
          fi

  infrastructure:
    name: Docker build and Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The ADR-047 audit found the API image could never boot, and the reason was invisible
      # because no image had ever been built. Building both images in CI is what stops that
      # class of defect from recurring.
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t ai-platform-api:ci .

      - name: Build the web image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8787 -t ai-platform-web:ci .

      # And that it actually STARTS — a build that produces an un-bootable image is the exact
      # failure this gate exists to catch (ADR-060).
      - name: Assert the API image boots in the worker role with no LLM key
        run: |
          set -euo pipefail
          docker run --rm -d --name api-boot-check \
            -e NODE_ENV=production -e ROLE=worker -e DATABASE_DIR=/tmp/pgdata \
            ai-platform-api:ci
          for i in $(seq 1 30); do
            if ! docker ps --filter name=api-boot-check --filter status=running -q | grep -q .; then
              echo "::error::The worker-role container exited instead of running."
              docker logs api-boot-check || true
              exit 1
            fi
            sleep 1
          done
          docker logs api-boot-check
          docker stop api-boot-check

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format check
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
