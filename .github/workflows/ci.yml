name: CI

# docs/26_DECISIONS.md ADR-035 (original) and ADR-061 (this revision).
#
# HONEST STATUS: this workflow has still never executed on GitHub Actions — the repository
# that authored it has no remote (`git remote -v` is empty). Every step below was chosen to
# match a command that IS run locally, but "CI green" remains unverified until a first push.
#
# The gates are ordered cheapest-first so a typo fails in seconds rather than after the full
# integration suite. Nothing is `continue-on-error`: a step that cannot fail is not a gate.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Packages must be built before typecheck: each workspace's `tsc --noEmit` resolves
      # cross-package types through the compiled `dist`, not through source.
      - name: Build packages
        run: npm run build:packages

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      # One root eslint.config.mjs, not a script per workspace: the root `lint` used to fan out
      # with `--if-present` over 26 workspaces, none of which defined the script, so it exited 0
      # having read nothing. Placed here for the same reason as typecheck — the type-aware rules
      # resolve cross-package types through the compiled `dist` — and before the app build
      # because it is the cheaper of the two.
      - name: Lint
        run: npm run lint

      # A migration that does not apply to an EMPTY database, or a schema hand-edited without a
      # regenerated migration, passes every test — the test database is built from the migrations
      # and the ORM agrees with the schema file — and then fails on the first real deployment,
      # where only the migrations exist (ADR-087). Cheap, so it runs before the apps build.
      # The frontend/backend separation is a structural requirement, and a directory layout does
      # not enforce it: one import re-couples the two applications and would typecheck, build and
      # pass every test. This is the step that makes the boundary able to fail (ADR-092).
      - name: Verify frontend/backend boundary
        run: bash scripts/verify-boundary.sh

      - name: Verify migrations
        run: bash scripts/verify-migrations.sh

      - name: Build apps
        run: npm run build

      # --- external services the integration tests genuinely use ------------------------
      # Both suites skip loudly rather than silently when their binary is absent; installing
      # them here is what makes those tests actually run in CI instead of quietly passing.
      - name: Install fake-gcs-server (Cloud Storage integration tests)
        run: |
          set -euo pipefail
          VERSION=1.56.1
          curl -sSfL -o /tmp/fake-gcs.tar.gz \
            "https://github.com/fsouza/fake-gcs-server/releases/download/v${VERSION}/fake-gcs-server_${VERSION}_Linux_amd64.tar.gz"
          mkdir -p /tmp/fake-gcs && tar -xzf /tmp/fake-gcs.tar.gz -C /tmp/fake-gcs
          echo "FAKE_GCS_SERVER_BIN=/tmp/fake-gcs/fake-gcs-server" >> "$GITHUB_ENV"

      - name: Install ClamAV daemon (malware scanning tests)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav-daemon
          # The tests spawn their own clamd with a one-signature database; the packaged
          # services must not hold the socket or the port.
          sudo systemctl stop clamav-freshclam clamav-daemon || true
          echo "CLAMD_BIN=/usr/sbin/clamd" >> "$GITHUB_ENV"

      # A general-purpose build, not a minimal one: the render pipeline needs a gif demuxer,
      # libx264 and the mp4 muxer, and the integration test probes for exactly those before it
      # will run (ADR-069).
      - name: Install ffmpeg (video render integration tests)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "FFMPEG_TEST_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Test (all workspaces)
        run: |
          set -euo pipefail
          # Tee'd once, and asserted below. This used to run `npm test` a second time inside the
          # assertion step: double the CI minutes, and the two runs could disagree.
          npm test 2>&1 | tee test-output.txt

      # A skipped test is not a passing test (product brief §29). Every binary these suites
      # need is installed above, so in CI a skip means the gate is broken, not the environment.
      #
      # This checks the SKIP COUNT vitest itself reports, not the wording of a message. The
      # previous version grepped for `SKIPPING the real (clamd|ffmpeg)|skipping (clamd|fake-gcs)`
      # and matched exactly ONE of the five real messages — the clamd, fake-gcs, long-form and
      # timeline suites could all skip silently while this step reported success, which is the
      # precise outcome it was written to prevent. A count cannot drift out of sync with the
      # wording of a console.warn.
      - name: Assert the gated suites actually ran
        run: |
          set -euo pipefail
          if grep -qE "Tests[[:space:]]+.*[0-9]+ skipped" test-output.txt; then
            echo "::error::A test was SKIPPED in CI. Every gated binary is installed above, so a skip means a gate is broken."
            grep -nE "Tests[[:space:]]+.*skipped" test-output.txt
            grep -niE "SKIPPING|is SKIPPED" test-output.txt || true
            exit 1
          fi
          if grep -qiE "SKIPPING|suite is SKIPPED" test-output.txt; then
            echo "::error::A suite printed a skip notice in CI."
            grep -niE "SKIPPING|suite is SKIPPED" test-output.txt
            exit 1
          fi

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build packages
        run: npm run build:packages
      - name: Test (web)
        run: npm test --workspace=@ai-platform/web --if-present
      - name: Build (web)
        run: npm run build --workspace=@ai-platform/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8790

  e2e:
    name: End-to-end (real browser, real API, real database)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build everything the suite drives
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8790
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Playwright starts both servers itself (see playwright.config.ts) so this exercises the
      # real API against a real database and the real production build of the web app.
      - name: Run E2E
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci

      # Fails on high/critical only. One moderate advisory is accepted and argued in
      # docs/27_RISKS_AND_LIMITATIONS.md; a blanket `--audit-level=moderate` would fail on it
      # every run and train everyone to ignore the gate.
      - name: Dependency audit
        run: npm audit --audit-level=high

      # Product brief §32: a mock provider must never be reachable in production.
      #
      # This was `grep -rn "new Mock" backend/src | grep -v NODE_ENV | grep -v test`, and it was
      # wrong in both directions. The LLM guard is an `if` on the line ABOVE the construction, so
      # the construction line contained neither word and survived both filters: the step exited 1
      # on correct code and this job could never pass. And a trailing `// NODE_ENV` comment would
      # have defeated it, so it did not reliably catch the real thing either.
      #
      # Replaced by a behavioural assertion that cannot be fooled by where a line break falls:
      # it builds the real provider set from a production config and checks that nothing in it
      # is a mock — and, in the other direction, that the mock IS there outside production, so
      # the test cannot pass by returning nothing at all.
      - name: Assert no production code path returns a fake implementation
        run: npx vitest run src/no-fake-in-production.test.ts
        working-directory: backend

  infrastructure:
    name: Docker build and Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The ADR-047 audit found the API image could never boot, and the reason was invisible
      # because no image had ever been built. Building both images in CI is what stops that
      # class of defect from recurring.
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t ai-platform-api:ci .

      - name: Build the web image
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8787 -t ai-platform-web:ci .

      # And that it actually STARTS — a build that produces an un-bootable image is the exact
      # failure this gate exists to catch (ADR-060).
      - name: Assert the API image boots in the worker role with no LLM key
        run: |
          set -euo pipefail
          docker run --rm -d --name api-boot-check \
            -e NODE_ENV=production -e ROLE=worker -e DATABASE_DIR=/tmp/pgdata \
            ai-platform-api:ci
          for i in $(seq 1 30); do
            if ! docker ps --filter name=api-boot-check --filter status=running -q | grep -q .; then
              echo "::error::The worker-role container exited instead of running."
              docker logs api-boot-check || true
              exit 1
            fi
            sleep 1
          done
          docker logs api-boot-check
          docker stop api-boot-check

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format check
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Terraform validate
        run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
